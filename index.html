<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>AA. 分帳神器 V3</title>

    <!-- App 圖示 -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#8fa8e8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AA分帳">

    <style>
        /* 你原本的 CSS */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

    color: #fff;

    min-height: 100vh;

    /*
        夢幻背景
        藍天 → 藍紫 → 粉紫 → 粉橘
    */

    background:

        radial-gradient(
            circle at 15% 5%,
            rgba(255,255,255,.48),
            transparent 28%
        ),

        radial-gradient(
            circle at 88% 12%,
            rgba(255,184,214,.55),
            transparent 30%
        ),

        radial-gradient(
            circle at 15% 75%,
            rgba(255,185,160,.38),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 70%,
            rgba(153,181,255,.35),
            transparent 38%
        ),

        linear-gradient(
            180deg,
            #6f9fe0 0%,
            #82a8e5 18%,
            #9fa9e4 38%,
            #c4a8d7 57%,
            #e5aaa9 75%,
            #edae9e 100%
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* 背景柔光 */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -1;

    background:

        radial-gradient(
            ellipse at 50% 20%,
            rgba(255,255,255,.18),
            transparent 45%
        ),

        radial-gradient(
            ellipse at 0% 100%,
            rgba(255,200,170,.2),
            transparent 40%
        ),

        radial-gradient(
            ellipse at 100% 60%,
            rgba(145,175,255,.18),
            transparent 42%
        );
}


/* 很淡的星光 */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -1;

    background:

        radial-gradient(
            circle at 12% 20%,
            rgba(255,255,255,.35) 0 1.5px,
            transparent 2.5px
        ),

        radial-gradient(
            circle at 78% 15%,
            rgba(255,255,255,.3) 0 1.5px,
            transparent 2.5px
        ),

        radial-gradient(
            circle at 60% 42%,
            rgba(255,255,255,.22) 0 1.5px,
            transparent 2.5px
        ),

        radial-gradient(
            circle at 20% 65%,
            rgba(255,255,255,.2) 0 2px,
            transparent 3px
        );

    background-size:
        190px 190px,
        230px 230px,
        260px 260px,
        300px 300px;

    opacity: .65;
}


button,
input {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;
}


/* APP */

.app {

    width: 100%;

    max-width: 560px;

    margin: auto;

    padding:
        20px
        16px
        60px;

    /*
       不限制高度
       保持原本上下滑動
    */
}


/* HEADER */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 22px;
}

.logo {

    font-size: 30px;

    font-weight: 900;

    letter-spacing: -1px;
}

.version {

    font-size: 11px;

    padding:
        6px
        10px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.14);

    border:
        1px solid rgba(255,255,255,.2);

    color: #fff;

    backdrop-filter: blur(10px);
}


/* CARD */

.card {

    background:
        rgba(255,255,255,.075);

    border:
        1px solid rgba(255,255,255,.13);

    border-radius: 22px;

    padding: 18px;

    margin-bottom: 15px;

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 12px 35px rgba(38,55,110,.16);
}

.title {

    font-size: 17px;

    font-weight: 800;

    margin-bottom: 15px;
}

.subtitle {

    font-size: 12px;

    color: #d9ddec;

    margin-top: -9px;

    margin-bottom: 15px;

    line-height: 1.6;
}


/* TOTAL */

.total-card {

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.17),
            rgba(203,218,255,.13)
        );

    border:
        1px solid rgba(255,255,255,.2);
}

.total-label {

    color: #dce4f7;

    font-size: 13px;
}

.total-number {

    font-size: 38px;

    font-weight: 900;

    margin-top: 4px;
}


/* INPUT */

input[type="text"],
input[type="number"] {

    width: 100%;

    padding:
        13px
        14px;

    border-radius: 14px;

    border:
        1px solid rgba(255,255,255,.14);

    outline: none;

    background:
        rgba(0,0,0,.16);

    color: #fff;

    margin-bottom: 10px;

    backdrop-filter: blur(10px);
}

input::placeholder {
    color: #b8bfd2;
}

input:focus {

    border-color:
        rgba(177,198,255,.75);

    background:
        rgba(0,0,0,.22);
}


/* BUTTON */

.primary {

    width: 100%;

    padding: 15px;

    border-radius: 15px;

    background:

        linear-gradient(
            135deg,
            #765cff,
            #477fff
        );

    color: #fff;

    font-weight: 800;

    box-shadow:
        0 8px 22px
        rgba(74,83,220,.28);
}

.primary:active {
    transform: scale(.98);
}

.secondary {

    width: 100%;

    padding: 13px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.1);

    color: #fff;

    font-weight: 700;

    border:
        1px solid rgba(255,255,255,.1);
}

.small-btn {

    padding:
        8px
        11px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.09);

    color: #c7cbda;

    font-size: 12px;
}

.danger {
    color: #ff9aa7;
}


/* MEMBERS */

.member-list {

    display: flex;

    flex-wrap: wrap;

    gap: 9px;

    margin-bottom: 14px;
}

.member {

    display: flex;

    align-items: center;

    gap: 8px;

    background:
        rgba(255,255,255,.08);

    padding:
        8px
        10px;

    border-radius: 13px;

    font-size: 13px;

    border:
        1px solid rgba(255,255,255,.08);
}

.member button {

    background: none;

    color: #adb2c5;

    font-size: 14px;
}


/* PAYMENT */

.payment-box {

    border:
        1px solid rgba(255,255,255,.09);

    background:
        rgba(0,0,0,.11);

    border-radius: 18px;

    padding: 15px;

    margin-bottom: 12px;
}

.payment-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;
}

.payment-name {

    font-weight: 800;

    font-size: 15px;
}

.payment-amount {

    font-weight: 900;
}

.payment-info {

    color: #c0c5d6;

    font-size: 12px;

    margin-bottom: 10px;
}

.checkbox-list {

    display: grid;

    gap: 8px;
}

.check-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(255,255,255,.055);

    padding:
        10px
        11px;

    border-radius: 12px;

    font-size: 13px;
}

.check-left {

    display: flex;

    align-items: center;

    gap: 9px;
}

.check-row input[type="checkbox"] {

    width: 18px;

    height: 18px;

    accent-color: #745cff;
}

.pay-input {

    width: 110px !important;

    margin: 0 !important;

    padding: 9px !important;

    text-align: right;
}


/* PAYMENT STATUS */

.payment-status {

    margin-top: 12px;

    padding:
        10px
        12px;

    border-radius: 12px;

    font-size: 12px;

    line-height: 1.5;
}

.status-ok {

    background:
        rgba(62,220,145,.1);

    color: #72edac;
}

.status-warn {

    background:
        rgba(255,190,80,.1);

    color: #ffd074;
}

.status-error {

    background:
        rgba(255,80,100,.1);

    color: #ff9aa5;
}


/* RESULT */

.result {
    display: none;
}

.result.show {
    display: block;
}

.person-result {

    padding:
        13px 0;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.person-result:last-child {
    border-bottom: none;
}

.person-top {

    display: flex;

    justify-content: space-between;

    margin-bottom: 7px;
}

.person-name {
    font-weight: 800;
}

.person-balance {
    font-weight: 900;
}

.balance-positive {
    color: #65e8a3;
}

.balance-negative {
    color: #ff8796;
}

.balance-zero {
    color: #c4c8d5;
}

.person-detail {

    display: flex;

    justify-content: space-between;

    color: #aeb4c6;

    font-size: 11px;
}


/* TRANSFER */

.transfer-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        14px 0;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.transfer-item:last-child {
    border-bottom: none;
}

.transfer-arrow {

    color: #aeb4c4;

    padding:
        0 8px;
}

.transfer-amount {

    font-weight: 900;

    color: #fff;
}


/* EMPTY */

.empty {

    text-align: center;

    padding:
        18px 0;

    color: #b1b6c6;

    font-size: 13px;
}


/* NOTE */

.note {

    font-size: 11px;

    color: #a8aec0;

    line-height: 1.6;

    margin-top: 10px;
}


/* FOOTER */

.footer {

    text-align: center;

    color: rgba(255,255,255,.55);

    font-size: 11px;

    padding-top: 5px;
}

/* ========================================
   V3 文字清晰度修正版
   ======================================== */

/* 一般文字改成深藍 */
body {
    color: #18345f;
}


/* 卡片標題 */
.title {

}


/* 副標題 */

/* 總金額 */

    border-color: rgba(86,116,220,.5);
}


/* 消費紀錄 */
.payment-box {
    background: rgba(255,255,255,.48);
    border-color: rgba(255,255,255,.65);
}

.payment-name {
    color: #19375f;
}

.payment-amount {
    color: #17345f;

    color: #607596;
}


/* 勾選區 */
.check-row {
    color: #28496f;
    background: rgba(255,255,255,.52);
}

.check-left span {

}

}

}

/* ========================================
   按鈕文字維持白色

</style>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            AA.
        </div>

        <div class="version">
            V3 · 多人湊錢
        </div>

    </div>


    <!-- TOTAL -->

    <div class="card total-card">

        <div class="total-label">
            目前消費總額
        </div>

        <div
            class="total-number"
            id="totalAmount"
        >
            $0
        </div>

    </div>


    <!-- MEMBERS -->

    <div class="card">

        <div class="title">
            👥 成員
        </div>

        <div
            id="memberList"
            class="member-list"
        ></div>

        <input
            id="memberInput"
            type="text"
            placeholder="輸入成員名稱，例如：小明"
            maxlength="20"
        >

        <button
            class="primary"
            onclick="addMember()"
        >
            ＋ 新增成員
        </button>

    </div>


    <!-- NEW PAYMENT -->

    <div class="card">

        <div class="title">
            🧾 新增消費
        </div>

        <input
            id="paymentTitle"
            type="text"
            placeholder="消費名稱，例如：火鍋"
            maxlength="30"
        >

        <input
            id="paymentAmount"
            type="number"
            placeholder="金額"
            min="0"
            step="1"
        >

        <div class="subtitle">
            先選擇這筆消費有哪些人參與
        </div>

        <div
            id="paymentParticipants"
            class="checkbox-list"
        ></div>

        <br>

        <div class="subtitle">

            💳 這筆錢誰有實際付款？

            <br>

            可以多人一起付，例如 A 付 400、B 付 300、C 付 300。

        </div>

        <div
            id="paymentPayers"
            class="checkbox-list"
        ></div>

        <div id="newPaymentStatus"></div>

        <br>

        <button
            class="primary"
            onclick="addPayment()"
        >
            ＋ 加入這筆消費
        </button>

    </div>


    <!-- PAYMENT LIST -->

    <div class="card">

        <div class="title">
            📋 消費紀錄
        </div>

        <div id="paymentList"></div>

    </div>


    <!-- CALCULATE -->

    <div class="card">

        <div class="title">
            💰 結算
        </div>

        <div class="subtitle">
            所有消費確認完成後，再按下開始結算。
        </div>

        <button
            class="primary"
            onclick="calculate()"
        >
            💰 開始結算
        </button>

    </div>


    <!-- RESULTS -->

    <div
        class="card result"
        id="resultCard"
    >

        <div class="title">
            📊 每個人的帳
        </div>

        <div id="resultList"></div>

    </div>


    <!-- TRANSFERS -->

    <div
        class="card result"
        id="transferCard"
    >

        <div class="title">
            💸 最終轉帳方式
        </div>

        <div id="transferList"></div>

        <button
            class="secondary"
            style="margin-top:14px"
            onclick="copyResult()"
        >
            📋 複製結算結果
        </button>

    </div>


    <!-- RESET -->

    <div class="card">

        <button
            class="secondary danger"
            onclick="resetAll()"
        >
            清除本次分帳
        </button>

    </div>


    <div class="footer">
        AA. 分帳神器 · V3
    </div>

</div>


<script>


/* =========================
   DATA
========================= */

let data = {

    members: [],

    payments: []

};

let lastSettlement = null;


/* =========================
   LOAD / SAVE
========================= */

function saveData() {

    localStorage.setItem(
        "AA_V3_DATA",
        JSON.stringify(data)
    );

}


function loadData() {

    const saved =
        localStorage.getItem(
            "AA_V3_DATA"
        );


    if (saved) {

        try {

            data =
                JSON.parse(saved);

        } catch (e) {

            data = {

                members: [],

                payments: []

            };

        }

    }

    renderAll();

}


/* =========================
   FORMAT
========================= */

function formatMoney(number) {

    number =
        Math.round(
            Number(number) || 0
        );

    return "$" +
        number.toLocaleString(
            "zh-TW"
        );

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   MEMBER
========================= */

function addMember() {

    const input =
        document.getElementById(
            "memberInput"
        );

    const name =
        input.value.trim();


    if (!name) {

        alert("請輸入成員名稱！");

        return;

    }


    if (
        data.members.includes(name)
    ) {

        alert(
            "這個成員已經存在！"
        );

        return;

    }


    data.members.push(name);

    input.value = "";

    saveData();

    renderAll();

}


function deleteMember(index) {

    const name =
        data.members[index];


    if (

        data.payments.some(
            p =>
                p.participants.includes(
                    name
                ) ||

                p.payers.some(
                    x =>
                        x.name === name
                )
        )

    ) {

        alert(
            "這位成員已經出現在消費紀錄裡，請先刪除相關消費。"
        );

        return;

    }


    data.members.splice(
        index,
        1
    );

    saveData();

    renderAll();

}


/* =========================
   RENDER MEMBERS
========================= */

function renderMembers() {

    const box =
        document.getElementById(
            "memberList"
        );


    if (
        data.members.length === 0
    ) {

        box.innerHTML =

            `<div class="empty">
                還沒有成員
            </div>`;

        return;

    }


    box.innerHTML =

        data.members
            .map(
                (name, index) => {

                    return `

                        <div class="member">

                            <span>
                                👤
                                ${escapeHTML(name)}
                            </span>

                            <button
                                onclick="deleteMember(${index})"
                            >
                                ×
                            </button>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================
   PAYMENT FORM
========================= */

function renderPaymentForm() {

    const participantBox =
        document.getElementById(
            "paymentParticipants"
        );


    const payerBox =
        document.getElementById(
            "paymentPayers"
        );


    if (
        data.members.length === 0
    ) {

        participantBox.innerHTML =

            `<div class="empty">
                請先新增成員
            </div>`;

        payerBox.innerHTML = "";

        return;

    }


    participantBox.innerHTML =

        data.members
            .map(
                (name, index) => {

                    return `

                        <label class="check-row">

                            <div class="check-left">

                                <input
                                    type="checkbox"
                                    class="participant-check"
                                    value="${escapeHTML(name)}"
                                    checked
                                >

                                <span>
                                    ${escapeHTML(name)}
                                </span>

                            </div>

                        </label>

                    `;

                }
            )
            .join("");


    payerBox.innerHTML =

        data.members
            .map(
                (name, index) => {

                    return `

                        <label class="check-row">

                            <div class="check-left">

                                <input
                                    type="checkbox"
                                    class="payer-check"
                                    data-name="${escapeHTML(name)}"
                                    onchange="updateNewPaymentStatus()"
                                >

                                <span>
                                    ${escapeHTML(name)}
                                </span>

                            </div>


                            <input
                                type="number"
                                class="pay-input"
                                data-payer="${escapeHTML(name)}"
                                placeholder="$0"
                                min="0"
                                step="1"
                                oninput="updateNewPaymentStatus()"
                            >

                        </label>

                    `;

                }
            )
            .join("");

}


/* =========================
   NEW PAYMENT STATUS
========================= */

function updateNewPaymentStatus() {

    const amount =

        Number(
            document.getElementById(
                "paymentAmount"
            ).value
        ) || 0;


    const payers =

        document.querySelectorAll(
            ".payer-check"
        );


    let paid = 0;


    payers.forEach(
        check => {

            if (!check.checked)
                return;


            const name =
                check.dataset.name;


            const input =
                document.querySelector(

                    `.pay-input[data-payer="${CSS.escape(name)}"]`

                );


            paid +=
                Number(
                    input?.value
                ) || 0;

        }
    );


    const box =
        document.getElementById(
            "newPaymentStatus"
        );


    if (!amount) {

        box.innerHTML = "";

        return;

    }


    const difference =

        Math.round(
            (paid - amount) * 100
        ) / 100;


    if (difference === 0) {

        box.innerHTML =

            `<div
                class="payment-status status-ok"
            >
                ✅ 付款金額正確：
                ${formatMoney(paid)}
            </div>`;

    }

    else if (difference < 0) {

        box.innerHTML =

            `<div
                class="payment-status status-warn"
            >
                ⚠️ 還差
                ${formatMoney(
                    Math.abs(difference)
                )}
                才能完成這筆付款
            </div>`;

    }

    else {

        box.innerHTML =

            `<div
                class="payment-status status-error"
            >
                ❌ 多付了
                ${formatMoney(difference)}
                ，請確認金額
            </div>`;

    }

}


/* =========================
   ADD PAYMENT
========================= */

function addPayment() {

    const title =

        document.getElementById(
            "paymentTitle"
        ).value.trim();


    const amount =

        Number(
            document.getElementById(
                "paymentAmount"
            ).value
        );


    if (!title) {

        alert(
            "請輸入消費名稱！"
        );

        return;

    }


    if (!amount || amount <= 0) {

        alert(
            "請輸入正確的金額！"
        );

        return;

    }


    const participantChecks =

        document.querySelectorAll(
            ".participant-check:checked"
        );


    const participants =

        Array.from(
            participantChecks
        )
        .map(
            x => x.value
        );


    if (
        participants.length === 0
    ) {

        alert(
            "至少要有一個人參與這筆消費！"
        );

        return;

    }


    const payerChecks =

        document.querySelectorAll(
            ".payer-check:checked"
        );


    if (
        payerChecks.length === 0
    ) {

        alert(
            "請至少選擇一位付款人！"
        );

        return;

    }


    let payers = [];

    let totalPaid = 0;


    payerChecks.forEach(
        check => {

            const name =
                check.dataset.name;


            const input =
                document.querySelector(

                    `.pay-input[data-payer="${CSS.escape(name)}"]`

                );


            const paid =
                Number(
                    input?.value
                ) || 0;


            if (paid > 0) {

                payers.push({

                    name: name,

                    amount: paid

                });


                totalPaid += paid;

            }

        }
    );


    totalPaid =

        Math.round(
            totalPaid * 100
        ) / 100;


    if (
        payers.length === 0
    ) {

        alert(
            "請輸入至少一位付款人的付款金額！"
        );

        return;

    }


    if (
        totalPaid !== amount
    ) {

        alert(

            `付款金額不正確！\n\n` +

            `消費金額：
            ${formatMoney(amount)}\n` +

            `目前付款：
            ${formatMoney(totalPaid)}\n` +

            `差額：
            ${formatMoney(
                Math.abs(
                    amount - totalPaid
                )
            )}`

        );

        return;

    }


    data.payments.push({

        id: Date.now(),

        title: title,

        amount: amount,

        participants:
            participants,

        payers: payers

    });


    document.getElementById(
        "paymentTitle"
    ).value = "";


    document.getElementById(
        "paymentAmount"
    ).value = "";


    saveData();

    renderAll();

}


/* =========================
   DELETE PAYMENT
========================= */

function deletePayment(index) {

/* =========================
   TOTAL
========================= */

function renderTotal() {

    const total =

                ),

/* =========================
   CALCULATE SHARE
========================= */

function calculateShares() {

    const shares = {};


    data.members.forEach(
        name => {

            shares[name] = 0;

        }
    );


    data.payments.forEach(
        payment => {

            const people =
                payment.participants;


            if (
                people.length === 0
            )
                return;


            const each =

                payment.amount /
                people.length;


            people.forEach(
                name => {

                    shares[name] += each;

                }
            );

        }
    );


    return shares;

}


/* =========================
   CALCULATE
========================= */

function calculate() {

    if (
        data.members.length === 0
    ) {

        alert(
            "請先新增成員！"
        );

        return;

    }


    if (
        data.payments.length === 0
    ) {

        alert(
            "目前還沒有任何消費！"
        );

        return;

    }


    for (
        const payment of data.payments
    ) {

        const totalPaid =

            payment.payers.reduce(

                (sum, p) =>

                    sum +
                    Number(
                        p.amount
                    ),

                0

            );


        if (

            Math.round(
                totalPaid * 100
            )

            !==

            Math.round(
                payment.amount * 100
            )

        ) {

            alert(

                `「${payment.title}」的付款金額不正確。`

            );

            return;

        }

    }


    const shares =
        calculateShares();


    const paid = {};


    data.members.forEach(
        name => {

            paid[name] = 0;

        }
    );


    data.payments.forEach(
        payment => {

            payment.payers.forEach(
                payer => {

                    if (
                        paid[payer.name]
                        !== undefined
                    ) {

                        paid[payer.name] +=

                            Number(
                                payer.amount
                            );

                    }

                }
            );

        }
    );


    const balances = {};


    data.members.forEach(
        name => {

            balances[name] =

                paid[name] -
                shares[name];

        }
    );


    renderResults(
        shares,
        paid,
        balances
    );


    const transfers =

        calculateTransfers(
            balances
        );


    renderTransfers(
        transfers
    );


    lastSettlement = {

        shares,

        paid,

        balances,

        transfers

    };


    document
        .getElementById(
            "resultCard"
        )
        .classList.add(
            "show"
        );


    document
        .getElementById(
            "transferCard"
        )
        .classList.add(
            "show"
        );


    document
        .getElementById(
            "resultCard"
        )
        .scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

}


/* =========================
   RESULT
========================= */

function renderResults(
    shares,
    paid,
    balances
) {

    const box =
        document.getElementById(
            "resultList"
        );


    box.innerHTML =

        data.members
            .map(
                name => {

                    const balance =

                        Math.round(
                            balances[name]
                            * 100
                        ) / 100;


                    let cls =
                        "balance-zero";


                    let text =
                        "剛好結清";


                    if (
                        balance > 0.01
                    ) {

                        cls =
                            "balance-positive";

                        text =

                            `應收
                            ${formatMoney(
                                balance
                            )}`;

                    }

                    else if (
                        balance < -0.01
                    ) {

                        cls =
                            "balance-negative";

                        text =

                            `應付
                            ${formatMoney(
                                Math.abs(
                                    balance
                                )
                            )}`;

                    }


                    return `

                        <div
                            class="person-result"
                        >

                            <div
                                class="person-top"
                            >

                                <div
                                    class="person-name"
                                >

                                    ${escapeHTML(
                                        name
                                    )}

                                </div>


                                <div
                                    class="person-balance ${cls}"
                                >

                                    ${text}

                                </div>

                            </div>


                            <div
                                class="person-detail"
                            >

                                <span>

                                    已付款
                                    ${formatMoney(
                                        paid[name]
                                    )}

                                </span>


                                <span>

                                    應負擔
                                    ${formatMoney(
                                        shares[name]
                                    )}

                                </span>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================
   TRANSFERS
========================= */

function calculateTransfers(
    balances
) {

    let creditors = [];

    let debtors = [];


    Object.keys(
        balances
    ).forEach(
        name => {

            const amount =

                Math.round(
                    balances[name]
                    * 100
                ) / 100;


            if (
                amount > 0.01
            ) {

                creditors.push({

                    name: name,

                    amount: amount

                });

            }

            else if (
                amount < -0.01
            ) {

                debtors.push({

                    name: name,

                    amount:
                        Math.abs(
                            amount
                        )

                });

            }

        }
    );


    creditors.sort(
        (a,b) =>
            b.amount - a.amount
    );


    debtors.sort(
        (a,b) =>
            b.amount - a.amount
    );


    const transfers = [];


    let i = 0;

    let j = 0;


    while (

        i < debtors.length &&

        j < creditors.length

    ) {

        const debtor =
            debtors[i];


        const creditor =
            creditors[j];


        const amount =

            Math.min(

                debtor.amount,

                creditor.amount

            );


        transfers.push({

            from:
                debtor.name,

            to:
                creditor.name,

            amount:

                Math.round(
                    amount * 100
                ) / 100

        });


        debtor.amount -=
            amount;


        creditor.amount -=
            amount;


        if (
            debtor.amount < 0.01
        ) {

            i++;

        }


        if (
            creditor.amount < 0.01
        ) {

            j++;

        }

    }


    return transfers;

}


/* =========================
   RENDER TRANSFERS
========================= */

function renderTransfers(
    transfers
) {

    const box =
        document.getElementById(
            "transferList"
        );


    if (

    ) {

        box.innerHTML =

            `<div class="empty">

                🎉 大家已經剛好結清，
                不需要轉帳！

            </div>`;

        return;

    }


    box.innerHTML =

            .map(

                    return `

                        <div

                        >

                            <div>

                                <b>
                                    ${escapeHTML(
                                        t.from
                                    )}
                                </b>

                                <span
                                    class="transfer-arrow"
                                >
                                    →
                                </span>

                                <b>
                                    ${escapeHTML(
                                        t.to
                                    )}
                                </b>

                            </div>


                            <div
                                class="transfer-amount"
                            >

                                ${formatMoney(
                                    t.amount
                                )}

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================
   COPY
========================= */

function buildCopyText() {

    if (
        !lastSettlement
    ) {

        return "";

    }


    const {

        shares,

        paid,

        balances,

        transfers

    } = lastSettlement;


    let text =
        "💰 AA 分帳結算\n\n";


    text +=
        "【每個人的帳】\n";


    data.members.forEach(
        name => {

            const balance =

                Math.round(
                    balances[name]
                    * 100
                ) / 100;


            text +=

                `${name}\n` +

                `已付款：
                ${formatMoney(
                    paid[name]
                )}\n` +

                `應負擔：
                ${formatMoney(
                    shares[name]
                )}\n`;


            if (
                balance > 0.01
            ) {

                text +=

                    `應收：
                    ${formatMoney(
                        balance
                    )}\n`;

            }

            else if (
                balance < -0.01
            ) {

                text +=

                    `應付：
                    ${formatMoney(
                        Math.abs(
                            balance
                        )
                    )}\n`;

            }

            else {

                text +=
                    `已結清\n`;

            }


            text += "\n";

        }
    );


    text +=
        "【最終轉帳】\n";


    if (
        transfers.length === 0
    ) {

        text +=
            "大家已經結清，不需要轉帳。\n";

    }

    else {

        transfers.forEach(
            t => {

                text +=

                    `${t.from} → ${t.to}：` +

                    `${formatMoney(
                        t.amount
                    )}\n`;

            }
        );

    }


    return text;

}


function copyResult() {

    const text =
        buildCopyText();


    if (!text)
        return;


    if (

        navigator.clipboard &&

        navigator.clipboard.writeText

    ) {

        navigator.clipboard
            .writeText(text)

            .then(
                () => {

                    alert(
                        "✅ 結算結果已複製！"
                    );

                }
            )

            .catch(
                () => {

                    fallbackCopy(text);

                }
            );

    }

    else {

        fallbackCopy(text);

    }

}


function fallbackCopy(text) {

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        text;


    document.body.appendChild(
        textarea
    );


    textarea.select();


    document.execCommand(
        "copy"
    );


    textarea.remove();


    alert(
        "✅ 結算結果已複製！"
    );

}
